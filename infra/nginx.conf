# nginx config för prompts.teknikministeriet.se
# Server: bahnhof-prod
# Sökväg: /etc/nginx/sites-available/prompts.teknikministeriet.se
#
# Återställning:
#   1. sudo cp infra/nginx.conf /etc/nginx/sites-available/prompts.teknikministeriet.se
#   2. sudo ln -sf /etc/nginx/sites-available/prompts.teknikministeriet.se /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d prompts.teknikministeriet.se
#   4. sudo nginx -t && sudo systemctl reload nginx

server {
    server_name prompts.teknikministeriet.se;

    # Blockera AI-crawlers
    if ($is_ai_bot) {
        return 403;
    }

    # Blockera AI-traning, tillat indexering
    add_header X-Robots-Tag "noai, noimageai" always;

    root /var/www/prompts.teknikministeriet.se;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(css|js|png|webp|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Pagefind assets
    location /pagefind/ {
        expires 1d;
        add_header Cache-Control "public" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Custom 404
    error_page 404 /index.html;

    # SSL hanteras av Certbot vid installation (steg 3 ovan)
}

server {
    listen 80;
    server_name prompts.teknikministeriet.se;
    return 301 https://$host$request_uri;
}
